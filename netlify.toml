[build]
  command = "npm run build"
  publish = "dist"

# Serve the game under /epcigame/* on this site too, matching the
# Vite `base` the assets are built with, so inovatek.app can proxy
# /epcigame/* straight through to this site.
[[redirects]]
  from = "/epcigame/*"
  to = "/:splat"
  status = 200
